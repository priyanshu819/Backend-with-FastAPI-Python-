<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Patient Management System</title>
    <style>
        body { font-family: Arial, sans-serif; background-color: #f4f4f9; padding: 20px; }
        .container { display: flex; gap: 20px; }
        .form-section, .data-section { background: white; padding: 20px; border-radius: 8px; box-shadow: 0 4px 8px rgba(0,0,0,0.1); width: 50%; }
        input, select { width: 100%; padding: 8px; margin: 5px 0 15px 0; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box; }
        button { background-color: #4CAF50; color: white; padding: 10px 15px; border: none; border-radius: 4px; cursor: pointer; width: 100%; }
        button:hover { background-color: #45a049; }
        table { width: 100%; border-collapse: collapse; margin-top: 15px; }
        th, td { border: 1px solid #ddd; padding: 8px; text-align: left; }
        th { background-color: #4CAF50; color: white; }
    </style>
</head>
<body>

    <h1 style="text-align: center;">🏥 Patient Management Dashboard</h1>

    <div class="container">
        <!-- LEFT SIDE: ADD PATIENT FORM -->
        <div class="form-section">
            <h2>Add New Patient</h2>
            <form id="patientForm">
                <label>Patient ID:</label>
                <input type="text" id="id" required placeholder="P001">
                
                <label>Name:</label>
                <input type="text" id="name" required>
                
                <label>City:</label>
                <input type="text" id="city" required>
                
                <label>Age:</label>
                <input type="number" id="age" required>
                
                <label>Gender:</label>
                <select id="gender" required>
                    <option value="male">Male</option>
                    <option value="female">Female</option>
                    <option value="other">Other</option>
                </select>

                <label>Height (in meters):</label>
                <input type="number" step="0.01" id="height" required placeholder="1.75">
                
                <label>Weight (in kg):</label>
                <input type="number" step="0.1" id="weight" required placeholder="70.5">

                <button type="submit">Save Patient</button>
            </form>
            <p id="message" style="margin-top: 10px; font-weight: bold;"></p>
        </div>

        <!-- RIGHT SIDE: VIEW PATIENTS TABLE -->
        <div class="data-section">
            <h2>Patient Records</h2>
            <button onclick="loadPatients()" style="background-color: #008CBA; margin-bottom: 10px;">Refresh Data</button>
            
            <table>
                <thead>
                    <tr>
                        <th>ID</th>
                        <th>Name</th>
                        <th>City</th>
                        <th>Age</th>
                        <th>BMI</th>
                        <th>Verdict</th>
                    </tr>
                </thead>
                <tbody id="patientTableBody">
                    <!-- Data yahan JavaScript se aayega -->
                </tbody>
            </table>
        </div>
    </div>

    <!-- YAHAN SE BACKEND KO JODNE KA KAAM SHURU HOTA HAI -->
    <script>
        const API_URL = "http://127.0.0.1:8000";

        // FUNCTION 1: Backend se data lana (GET Request)
        function loadPatients() {
            fetch(`${API_URL}/view`)
            .then(response => response.json())
            .then(data => {
                const tableBody = document.getElementById('patientTableBody');
                tableBody.innerHTML = ''; // Pehle table khali karo
                
                // Data JSON object me hai, isliye Object.entries use kar rahe hain
                for (const [patientId, details] of Object.entries(data)) {
                    const row = `<tr>
                        <td>${patientId}</td>
                        <td>${details.name}</td>
                        <td>${details.city}</td>
                        <td>${details.age}</td>
                        <td>${details.bmi}</td>
                        <td><b>${details.verdict}</b></td>
                    </tr>`;
                    tableBody.innerHTML += row; // Table me row add karo
                }
            })
            
            .catch(error => console.error("Error loading data:", error));
        }

        // FUNCTION 2: Backend par data bhejna (POST Request)
        document.getElementById('patientForm').addEventListener('submit', function(e) {
            e.preventDefault(); // Page reload hone se roko

            // Form se data uthao aur JSON object banao
            const newPatient = {
                id: document.getElementById('id').value,
                name: document.getElementById('name').value,
                city: document.getElementById('city').value,
                age: parseInt(document.getElementById('age').value),
                gender: document.getElementById('gender').value,
                height: parseFloat(document.getElementById('height').value),
                weight: parseFloat(document.getElementById('weight').value)
            };

            // Fetch API se POST request bhejo
            fetch(`${API_URL}/create`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(newPatient)
            })
            .then(response => {
                if(!response.ok) throw new Error("ID already exists or invalid data");
                return response.json();
            })
            .then(data => {
                document.getElementById('message').style.color = "green";
                document.getElementById('message').innerText = data.message;
                document.getElementById('patientForm').reset(); // Form clear karo
                loadPatients(); // Naya data aane par table update karo
            })
            .catch(error => {
                document.getElementById('message').style.color = "red";
                document.getElementById('message').innerText = error.message;
            });
        });

        // Jab page pehli baar khule, toh data load kar do
        window.onload = loadPatients;
    </script>

</body>
</html>
